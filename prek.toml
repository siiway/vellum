# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
#
# Every hook runs a program directly (no `sh -c`), so it works the same under
# Git Bash, PowerShell and GUI clients on Windows. It needs `bun` on PATH.
#
# `bun install` installs the hooks (scripts/hooks.ts). CI runs the same hooks
# over every file (.github/workflows/pr.yml and deploy.yml).

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-merge-conflict"
stages = ["pre-commit"]

[[repos.hooks]]
id = "detect-private-key"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-added-large-files"
stages = ["pre-commit"]

[[repos]]
repo = "local"

# ── pre-commit: fast, rewrites files ──────────────────────────────────────────

[[repos.hooks]]
id = "prettier"
name = "prettier"
entry = "bun"
args = ["run", "format"]
language = "system"
stages = ["pre-commit"]
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "restage"
name = "restage formatted files"
entry = "git"
args = ["add", "-u"]
language = "system"
stages = ["pre-commit"]
pass_filenames = false
always_run = true

# Run by path under Bun with the changed files; ESLint finds eslint.config.js
# at the root.
[[repos.hooks]]
id = "eslint"
name = "eslint"
entry = "bun"
args = ["node_modules/eslint/bin/eslint.js"]
files = '^(src|scripts)/.*\.(tsx?|jsx?|mjs|cjs)$'
language = "system"
stages = ["pre-commit"]

# ── pre-push: slower checks that CI also runs ─────────────────────────────────

[[repos.hooks]]
id = "typecheck"
name = "typecheck"
entry = "bun"
args = ["run", "typecheck"]
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true

# Client build plus a wrangler dry-run of the Worker bundle.
[[repos.hooks]]
id = "build"
name = "build"
entry = "bun"
args = ["run", "build"]
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true
