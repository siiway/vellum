# Path labels for pull requests, applied by triage.yml. The config is read from
# the base branch, so a PR can't change its own labels by editing this file.

worker:
  - changed-files:
      - any-glob-to-any-file: "src/worker/**"

app:
  - changed-files:
      - any-glob-to-any-file: "src/app/**"

docs:
  - changed-files:
      - any-glob-to-any-file: ["local-docs/**", "README*.md", "AGENTS.md"]

i18n:
  - changed-files:
      - any-glob-to-any-file: "src/shared/i18n.ts"

config:
  - changed-files:
      - any-glob-to-any-file:
          ["vellum.config.json", "src/shared/types.ts", "src/shared/site-schema.json"]

database:
  - changed-files:
      - any-glob-to-any-file: "migrations/**"

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", "prek.toml"]

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["package.json", "bun.lock"]
