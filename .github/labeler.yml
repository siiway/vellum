# Path labels for pull requests, applied by triage.yml. The config is read from
# the base branch, so a PR can't change its own labels by editing this file.

worker:
  - changed-files:
      - any-glob-to-any-file: "app/src/worker/**"

web:
  - changed-files:
      - any-glob-to-any-file: "app/src/web/**"

docs:
  - changed-files:
      - any-glob-to-any-file: ["app/local-docs/**", "README*.md", "AGENTS.md"]

i18n:
  - changed-files:
      - any-glob-to-any-file: "app/src/shared/i18n.ts"

config:
  - changed-files:
      - any-glob-to-any-file:
          ["app/vellum.config.json", "app/src/shared/types.ts", "app/src/shared/site-schema.json"]

database:
  - changed-files:
      - any-glob-to-any-file: "app/src/worker/db/migrations/**"

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", "app/prek.toml"]

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["app/package.json", "app/bun.lock"]
