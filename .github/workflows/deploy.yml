name: Deploy

# Builds the whole static site (client bundle + every page of every docs repo)
# and deploys it to the production `vellum` Worker (docs.siiway.org,
# vellum.siiway.org) as static assets. If the repository is also connected to
# Cloudflare Workers Builds, disconnect it under the Worker's Settings ->
# Builds in the dashboard, or every push to main deploys twice.
#
# Triggers:
#   * push to `main`                 -> deploy production
#   * manual run (workflow_dispatch) -> redeploy production from main
#
# Docs repo changes don't need this: "Update content" (update-content.yml)
# re-renders just the repos that changed. This workflow leaves the build in the
# Actions cache for it.
#
# The prek hooks from app/prek.toml (file checks, prettier, eslint, typecheck,
# client build) run first, so a failure stops the deploy before anything
# reaches production.
#
# Two jobs, because the build runs the docs repos' code: it renders their
# React components (the "React components in Markdown" handbook page). The
# build job has no Cloudflare token, nor the `production` Environment that
# holds it, and its checkout keeps no GitHub token. The deploy job has the
# token and runs only this repository's code, installed afresh: it takes the
# build's output as data, without symbolic links, and uploads it with
# wrangler.
#
# Requires CLOUDFLARE_API_TOKEN as a `production` Environment secret, scoped
# to the SiiWay account with Workers Scripts:Edit, plus Workers Routes:Edit
# and Zone:Read on the zone, because production is attached to custom
# domains. VELLUM_GITHUB_TOKEN (optional) is a repository secret, for the
# build job: a token that can read private docs repos.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-run: a newer run waits for the current one, and
# replaces an older one still waiting (the newest main has its commits).
# update-content.yml has its own group and stays out of the way of this one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # A manual run started from another branch must not ship that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Commit hooks (prettier, eslint, file checks)
        run: bunx prek run -c prek.toml --all-files --show-diff-on-failure --color=always

      - name: Push hooks (typecheck, build and NOTICE.md)
        run: bunx prek run -c prek.toml --all-files --hook-stage pre-push --color=always

      - name: Build
        run: bun run build
        env:
          VELLUM_GITHUB_TOKEN: ${{ secrets.VELLUM_GITHUB_TOKEN }}

      # The docs repo clones, for update-content.yml to fetch into rather
      # than clone again. From here, as git wrote them: an artifact would
      # lose what git needs (empty directories), and a public repository's
      # artifacts are anyone's to download.
      - name: Save the clones
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.sources
          key: sources-${{ github.run_id }}-${{ github.run_attempt }}

      # The output, for the deploy job: the site, and the build that
      # update-content.yml updates.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: app/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # Gate point: add required reviewers or an environment-scoped token to the
    # `production` Environment to control deploys.
    environment:
      name: production
      url: https://docs.siiway.org
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Without the Bun cache, which the build job writes: wrangler runs here
      # with the token.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build

      # Outside the checkout, then only the output moves in, and nothing in it
      # may point elsewhere on this machine.
      - name: Take the build
        env:
          BUILD: ${{ runner.temp }}/build
        run: |
          if [ -n "$(find "$BUILD" -type l -print -quit)" ]; then
            echo "::error::The build has symbolic links."
            exit 1
          fi
          rm -rf dist
          mv "$BUILD" dist

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The build, for update-content.yml to update. Production runs this
      # commit now, so a failed save mustn't fail the run: Update content
      # goes by the last successful Deploy, and without a cached build of it,
      # builds everything from that commit.
      - name: Save the build
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/dist
          key: site-${{ github.run_id }}-${{ github.run_attempt }}
